server:
  port: 8088
  shutdown: graceful

spring:
  application:
    name: pig-tv-server
  profiles:
    active: dev
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  jackson:
    default-property-inclusion: non_null

pigtv:
  jwt:
    # 生产务必用环境变量覆盖
    secret: ${JWT_SECRET:pig-tv-server-please-change-this-secret-in-production-2026}
    ttl-hours: 720
  storage:
    dir: ${STORAGE_DIR:./data/apk}
    base-url: ${STORAGE_BASE_URL:http://127.0.0.1:8088/files}
  risk:
    max-segments: 3
    ban-hours: 72
    same-device-grace-minutes: 60
    online-window-minutes: 5
    unban-cooldown-hours: 24
  admin:
    init-username: admin
    init-password: ${ADMIN_INIT_PASSWORD:admin123}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:pigtv;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
logging:
  level:
    com.pigtv.server: INFO

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:pig_tv}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:pig_tv}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
logging:
  level:
    com.pigtv.server: INFO
  file:
    name: ./logs/pig-tv-server.log
